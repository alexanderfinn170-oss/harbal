<style>
body {margin:0;font-family:Arial,Helvetica,sans-serif;background:#f0f8f5;color:#222;line-height:1.6;}
.wrapper {max-width:900px;margin:auto;background:white;padding-bottom:50px;}
.header {background:#2e7d32;color:white;text-align:center;padding:40px 20px;}
.header img.logo {width:100px;height:100px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 20px;}
.header h1 {font-size:32px;margin:0;}
.section {padding:40px 20px;}
.slider {position:relative;width:100%;height:400px;overflow:hidden;margin-bottom:30px;}
.slide {position:absolute;width:100%;height:100%;opacity:0;transition:opacity 1s;}
.slide img {width:100%;height:100%;object-fit:cover;border-radius:10px;}
.active {opacity:1;}
.price-box {background:#e8f5e9;border:2px dashed #2e7d32;padding:25px;text-align:center;margin:20px 0;border-radius:10px;}
.old-price {text-decoration:line-through;color:gray;font-size:20px;}
.new-price {color:#1b5e20;font-size:28px;font-weight:bold;}
.btn {display:block;width:60%;margin:20px auto;background:#2e7d32;color:white;text-align:center;padding:18px;font-size:20px;text-decoration:none;border-radius:10px;}
.features li {margin:10px 0;font-size:18px;}
.product-section {margin-bottom:40px;}
.product-section img {width:100%;border-radius:10px;margin-bottom:15px;}
.video-section iframe {width:100%;height:450px;border:none;border-radius:10px;}
.order-box {background:#e8f5e9;padding:40px 20px;border-radius:10px;margin-top:50px;}
input, select {width:100%;padding:15px;margin:10px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;}
button {width:100%;padding:18px;background:#388e3c;color:white;border:none;font-size:20px;border-radius:10px;cursor:pointer;}
.footer {background:#1b5e20;color:white;text-align:center;padding:25px;font-size:14px;}
.success-message {display:none;background:#d4edda;color:#155724;padding:15px;margin-top:10px;border-radius:5px;font-size:16px;}
.float-buttons{position:fixed;bottom:25px;right:25px;display:flex;flex-direction:column;gap:15px;z-index:999;}
.float-buttons a{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#25d366;}
.float-buttons a.messenger{background:#0084ff;}
.float-buttons img{width:24px;height:24px;}

<div class="section price-box">

<script>
// Slider
let slides=document.querySelectorAll(".slide");
let index=0;
setInterval(()=>{
slides[index].classList.remove("active");
index=(index+1)%slides.length;
slides[index].classList.add("active");
},4000);

// SilentForms Submit
document.getElementById("orderForm").addEventListener("submit",function(e){
e.preventDefault();
let formData=new FormData(this);

fetch("https://api.silentforms.com/submit",{
method:"POST",
body:formData
})
.then(res=>res.json())
.then(data=>{
document.getElementById("successMsg").style.display="block";
fbq('track','Lead');
this.reset();
})
.catch(err=>{
alert("সাবমিট সমস্যা হয়েছে");
});
});
</script>
