<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Free Online Women Chat Room | Demo Community</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Join our free online women chat demo. Explore group conversations and create a free account to unlock full messaging features.">
<meta name="robots" content="index, follow">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b141a;
  color:white;
}

/* HEADER */
.header{
  height:60px;
  background:#202c33;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  position:fixed;
  top:0;
  width:100%;
  z-index:100;
}
.menuBtn{
  position:absolute;
  left:15px;
  font-size:22px;
  cursor:pointer;
}

/* SIDE MENU */
.sideMenu{
  position:fixed;
  top:0;
  left:-260px;
  width:250px;
  height:100%;
  background:#1f2c34;
  padding-top:70px;
  transition:0.3s;
  z-index:999;
}
.sideMenu a{
  display:block;
  padding:15px 20px;
  text-decoration:none;
  color:white;
  border-bottom:1px solid #2f3e46;
}
.sideMenu a:hover{
  background:#2f3e46;
}

/* CHAT */
.chatWrapper{
  padding:80px 15px 20px 15px;
  max-width:900px;
  margin:auto;
}
.messages{
  height:350px;
  overflow-y:auto;
  padding:10px;
  background:#111b21;
  border-radius:8px;
}
.inputBox{
  display:flex;
  margin-top:10px;
}
.inputBox input{
  flex:1;
  padding:10px;
  border-radius:20px;
  border:none;
}
.inputBox button{
  margin-left:5px;
  padding:10px 15px;
  border:none;
  border-radius:20px;
  background:#25d366;
  color:white;
  cursor:pointer;
}
.msg{
  display:flex;
  margin-bottom:10px;
}
.msg img{
  width:34px;
  height:34px;
  border-radius:50%;
  margin-right:8px;
}
.bubble{
  background:#202c33;
  padding:8px 12px;
  border-radius:12px;
  max-width:75%;
}
.me{justify-content:flex-end;}
.me .bubble{background:#005c4b;}
.name{font-size:12px;color:#53bdeb;}

/* MODAL */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
}
.modalContent{
  background:#1f2c34;
  padding:30px;
  border-radius:10px;
  max-width:400px;
  text-align:center;
}
.modalContent h3{color:#25d366;}
.modalContent a{
  display:inline-block;
  margin-top:15px;
  padding:12px 25px;
  background:red;
  color:white;
  text-decoration:none;
  border-radius:5px;
}
.closeBtn{
  margin-top:10px;
  cursor:pointer;
  color:#53bdeb;
}

/* INFO MODAL */
.infoModal{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.8);
  align-items:center;
  justify-content:center;
  z-index:3000;
}
.infoBox{
  background:#1f2c34;
  padding:25px;
  border-radius:10px;
  max-width:500px;
}
.infoBox h2{color:#25d366;}
.infoClose{
  margin-top:15px;
  cursor:pointer;
  color:#53bdeb;
  text-align:right;
}
.demoLabel{
  text-align:center;
  font-size:12px;
  opacity:.6;
  margin-bottom:5px;
}
</style>
</head>

<body>

<div class="header">
  <div class="menuBtn" onclick="openMenu()">⋮</div>
  🔥 Women Chat Room (Demo)
</div>

<!-- SIDE MENU -->
<div class="sideMenu" id="sideMenu">
  <a href="#" onclick="openInfo('features')">Platform Features</a>
  <a href="#" onclick="openInfo('continue')">How To Continue?</a>
  <a href="https://your-affiliate-link.com">Create Account</a>
</div>

<div class="chatWrapper">

<div class="demoLabel">Live Chat Demo Simulation</div>

<div class="messages" id="groupMessages"></div>

<div class="inputBox">
<input id="groupInput" placeholder="Type message...">
<button onclick="sendGroup()">Send</button>
</div>

</div>

<!-- SIGNUP MODAL -->
<div class="modal" id="signupModal">
  <div class="modalContent">
    <h3>Unlock Unlimited Messaging</h3>
    <p>Create a free account to continue chatting and access full features.</p>
    <a href="https://your-affiliate-link.com">Create Free Account</a>
    <div class="closeBtn" onclick="closeModal()">Continue Demo</div>
  </div>
</div>

<!-- INFO MODAL -->
<div class="infoModal" id="infoModal">
  <div class="infoBox" id="infoContent"></div>
</div>

<script>

/* MENU */
function openMenu(){
  let menu=document.getElementById("sideMenu");
  menu.style.left = menu.style.left==="0px" ? "-260px" : "0px";
}

/* INFO CONTENT */
function openInfo(type){
  let content=document.getElementById("infoContent");
  let modal=document.getElementById("infoModal");

  if(type==="features"){
    content.innerHTML=`
      <h2>Platform Features</h2>
      <p>• Real-time demo group chat<br>
      • Mobile friendly interface<br>
      • Safe and moderated environment<br>
      • Optional free account upgrade</p>
      <div class="infoClose" onclick="closeInfo()">Close</div>
    `;
  } else {
    content.innerHTML=`
      <h2>How To Continue?</h2>
      <p>You can explore the demo chat freely. To unlock unlimited messaging and private features, simply create a free account using the menu option.</p>
      <div class="infoClose" onclick="closeInfo()">Close</div>
    `;
  }

  modal.style.display="flex";
}

function closeInfo(){
  document.getElementById("infoModal").style.display="none";
}

/* CHAT DEMO SYSTEM */
const names=["Anna","Sofia","Maya","Lina","Nora","Emily"];
const messages=["Hello everyone!","Nice to meet you.","How is everyone?","Happy to join!","Let's talk!"];

let messageCount=0;
let box=document.getElementById("groupMessages");

/* Auto messages every 7 seconds */
setInterval(()=>{
  let name=names[Math.floor(Math.random()*names.length)];
  let text=messages[Math.floor(Math.random()*messages.length)];
  box.insertAdjacentHTML("beforeend",`
    <div class="msg">
      <img src="https://randomuser.me/api/portraits/women/${Math.floor(Math.random()*80)}.jpg">
      <div class="bubble">
        <div class="name">${name}</div>
        ${text}
      </div>
    </div>
  `);
  box.scrollTop=box.scrollHeight;
},7000);

function sendGroup(){
  let input=document.getElementById("groupInput");
  if(!input.value.trim()) return;

  messageCount++;

  box.insertAdjacentHTML("beforeend",`
    <div class="msg me">
      <div class="bubble">
        <div class="name">You</div>
        ${input.value}
      </div>
    </div>
  `);

  input.value="";
  box.scrollTop=box.scrollHeight;

  if(messageCount>=3){
    document.getElementById("signupModal").style.display="flex";
  }
}

function closeModal(){
  document.getElementById("signupModal").style.display="none";
}

</script>

</body>
</html>
