<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রিমিয়াম হারবাল ঔষধ</title>

<!-- Facebook Pixel Code -->

n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;

}(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');

<style>
/* আপনার আগের সব CSS অপরিবর্তিত রাখা হয়েছে */
body {margin:0;font-family:Arial,Helvetica,sans-serif;background:#f0f8f5;color:#222;line-height:1.6;}
.wrapper {max-width:900px;margin:auto;background:white;padding-bottom:50px;}
.header {background:#2e7d32;color:white;text-align:center;padding:40px 20px; position: relative;}
.header img.logo {width:100px; height:100px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 20px;}
.header h1 {font-size:36px;font-weight:bold;margin:0;}
.section {padding:40px 20px;}
.price-box {background:#e8f5e9;border:2px dashed #2e7d32;padding:25px;text-align:center;margin:20px 0;border-radius:10px;}
.old-price {text-decoration:line-through;color:gray;font-size:20px;}
.new-price {color:#1b5e20;font-size:28px;font-weight:bold;margin-top:10px;}
.btn {display:block;width:60%;margin:20px auto;background:#2e7d32;color:white;text-align:center;padding:20px;font-size:22px;text-decoration:none;border-radius:10px;transition:0.3s;}
.btn:hover {background:#66bb6a;transform:scale(1.05);}
.order-box {background:#e8f5e9;padding:40px 20px;border:1px solid #a5d6a7;border-radius:10px;margin-top:50px;}
input, select {width:100%;padding:15px;margin:10px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;}
button {width:100%;padding:18px;background:#388e3c;color:white;border:none;font-size:20px;border-radius:10px;cursor:pointer;}
.footer {background:#1b5e20;color:white;text-align:center;padding:25px;font-size:14px;}
.success-message {display:none;background:#d4edda;color:#155724;padding:15px;margin-top:10px;border-radius:5px;font-size:16px;}
</style>
</head>
<body>

<div class="wrapper">

<div class="header">
<h1>প্রিমিয়াম হারবাল ঔষধ – স্বাস্থ্য ও শক্তি বৃদ্ধি</h1>
</div>

<div class="section order-box" id="order">
<h2>অর্ডার ফর্ম</h2>

<!-- ✅ SilentForms Integration -->
<form id="orderForm">

<input type="hidden" name="access_key" value="3c44d641148da9d23c9afa6be2e4ceb037320be71c43c4ca37b04f578f4c6aee">

<input type="text" name="name" placeholder="আপনার নাম লিখুন" required>
<input type="tel" name="phone" placeholder="মোবাইল নম্বর" required>
<input type="text" name="address" placeholder="সম্পূর্ণ ঠিকানা" required>

<select name="package" required>
<option value="">প্যাকেজ নির্বাচন করুন</option>
<option>১ প্যাক - ৳৭৯০ / ৫০ প্যাকেট</option>
<option>২ প্যাক - ৳১৫০০ / ১০০ প্যাকেট</option>
</select>

<button type="submit">অর্ডার কনফার্ম করুন</button>
</form>

<div class="success-message" id="successMsg">
ধন্যবাদ! আপনার অর্ডার সফলভাবে সাবমিট হয়েছে।
</div>
</div>

<div class="footer">
© ২০২৬ প্রিমিয়াম হারবাল ঔষধ | সর্বস্বত্ব সংরক্ষিত
</div>

</div>

<script>
document.getElementById("orderForm").addEventListener("submit", function(e){
e.preventDefault();

var formData = new FormData(this);

fetch("https://api.silentforms.com/submit", {
method: "POST",
body: formData
})
.then(response => response.json())
.then(data => {
document.getElementById("successMsg").style.display = "block";
fbq('track', 'Lead');
})
.catch(error => {
alert("সাবমিট করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।");
});
});
</script>

</body>
</html>
