<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Women Social Chat Community</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5;}
.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 15px;
background:#ff4da6;
color:#fff;
font-weight:bold;
font-size:18px;
}
.menu{cursor:pointer;font-size:22px;}
.dropdown{
display:none;
position:absolute;
right:10px;
top:50px;
background:#fff;
box-shadow:0 2px 8px rgba(0,0,0,.2);
border-radius:6px;
overflow:hidden;
}
.dropdown div{
padding:10px 15px;
cursor:pointer;
}
.dropdown div:hover{background:#eee;}
.chat-box{
height:70vh;
overflow-y:auto;
padding:10px;
}
.msg{
margin:5px 0;
padding:8px 12px;
border-radius:15px;
max-width:70%;
font-size:14px;
}
.left{background:#fff;}
.right{background:#ffccdd;margin-left:auto;}
.input-box{
display:flex;
padding:10px;
background:#fff;
}
input{
flex:1;
padding:8px;
border:1px solid #ccc;
border-radius:20px;
}
button{
padding:8px 15px;
margin-left:5px;
border:none;
background:#ff4da6;
color:#fff;
border-radius:20px;
cursor:pointer;
}
.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
justify-content:center;
align-items:center;
}
.popup-content{
background:#fff;
padding:20px;
border-radius:10px;
text-align:center;
width:80%;
max-width:300px;
}
.popup-content button{
width:100%;
margin-top:10px;
}
</style>
</head>
<body>

<div class="header">
<span>Women Social Chat Community</span>
<span class="menu" onclick="toggleMenu()">⋮</span>
</div>

<div class="dropdown" id="dropdown">
<div onclick="showPopup()">Create Account</div>
<div>Secure Chat</div>
<div>Private Community</div>
</div>

<div class="chat-box" id="chat"></div>

<div class="input-box">
<input type="text" id="msgInput" placeholder="Type message...">
<button onclick="sendMsg()">Send</button>
</div>

<div class="popup" id="popup">
<div class="popup-content">
<h3>Create Free Account</h3>
<p>Join to continue chatting</p>
<button onclick="closePopup()">Back</button>
</div>
</div>

<script>

let chat=document.getElementById("chat");
let index=0;
let userMsgCount=0;

function addMsg(text,side){
let div=document.createElement("div");
div.className="msg "+side;
div.innerText=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}

function autoMsg(){
let name=femaleNames[Math.floor(Math.random()*femaleNames.length)];
addMsg(name+": "+messagePool[index],"left");
index++;
if(index>=100){index=0;}
}

for(let i=0;i<50;i++){autoMsg();}

setInterval(autoMsg,2000);

function sendMsg(){
let input=document.getElementById("msgInput");
if(!input.value.trim())return;

if(userMsgCount>=3){
showPopup();
return;
}

addMsg("You: "+input.value,"right");
input.value="";
userMsgCount++;
}

function showPopup(){
document.getElementById("popup").style.display="flex";
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

function toggleMenu(){
let d=document.getElementById("dropdown");
d.style.display=d.style.display==="block"?"none":"block";
}
</script>
