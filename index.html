<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#f2f4f8;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 15px;
background:#ff4d6d;
color:white;
font-weight:bold;
}

.brand{
font-size:18px;
}

.menu{
font-size:22px;
cursor:pointer;
}

.chat-box{
height:75vh;
overflow-y:auto;
padding:10px;
background:white;
}

.message{
display:flex;
margin-bottom:10px;
}

.message img{
width:42px;
height:42px;
border-radius:50%;
margin-right:8px;
}

.bubble{
background:#f1f1f1;
padding:8px 12px;
border-radius:12px;
font-size:14px;
max-width:230px;
}

.name{
font-weight:bold;
font-size:13px;
display:flex;
align-items:center;
}

.online{
color:green;
font-size:11px;
margin-left:6px;
}

.input-area{
display:flex;
padding:10px;
background:white;
border-top:1px solid #ddd;
}

input{
flex:1;
padding:8px;
border-radius:20px;
border:1px solid #ccc;
}

button{
padding:8px 15px;
border:none;
background:#ff4d6d;
color:white;
border-radius:20px;
margin-left:5px;
cursor:pointer;
}
</style>

let msgIndex=0;

function addMessage(profile,text){
const chatBox=document.getElementById("chatBox");
const msg=document.createElement("div");
msg.className="message";
msg.innerHTML=`
<img src="${profile.img}">
<div>
<div class="name">${profile.name} <span class="online">● Online</span></div>
<div class="bubble">${text}</div>
</div>
`;
chatBox.appendChild(msg);
chatBox.scrollTop=chatBox.scrollHeight;
}

function autoReply(){
addMessage(profiles[msgIndex%100],messagePool[msgIndex]);
msgIndex++;
if(msgIndex>=100){msgIndex=0;}
}

function sendMessage(){
const input=document.getElementById("userInput");
if(input.value.trim()!==""){
addMessage({name:"Guest",img:"https://randomuser.me/api/portraits/lego/1.jpg"},input.value);
input.value="";
}
}

// preload first 100
for(let i=0;i<100;i++){

}
