<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Women Chat Room – Guest Access</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Join our women chat room as a guest. Explore conversations and create a free account to unlock unlimited messaging.">
<meta name="robots" content="index, follow">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b141a;
  color:white;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  height:60px;
  background:#202c33;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  position:fixed;
  top:0;
  width:100%;
  z-index:100;
}
.menuBtn{
  position:absolute;
  left:15px;
  font-size:22px;
  cursor:pointer;
}

/* SIDE MENU */
.sideMenu{
  position:fixed;
  top:0;
  left:-260px;
  width:250px;
  height:100%;
  background:#1f2c34;
  padding-top:70px;
  transition:0.3s;
  z-index:999;
}
.sideMenu a{
  display:block;
  padding:15px 20px;
  text-decoration:none;
  color:white;
  border-bottom:1px solid #2f3e46;
}
.sideMenu a:hover{
  background:#2f3e46;
}

/* CHAT FULL SCREEN */
.messages{
  flex:1;
  overflow-y:auto;
  padding:70px 10px 80px 10px;
}
.inputBox{
  height:60px;
  background:#202c33;
  display:flex;
  align-items:center;
  padding:0 10px;
  position:fixed;
  bottom:0;
  width:100%;
}
.inputBox input{
  flex:1;
  padding:10px;
  border-radius:20px;
  border:none;
}
.inputBox button{
  margin-left:5px;
  padding:10px 15px;
  border:none;
  border-radius:20px;
  background:#25d366;
  color:white;
  cursor:pointer;
}
.msg{
  display:flex;
  margin-bottom:12px;
}
.msg img{
  width:34px;
  height:34px;
  border-radius:50%;
  margin-right:8px;
}
.bubble{
  background:#202c33;
  padding:8px 12px;
  border-radius:12px;
  max-width:75%;
}
.me{justify-content:flex-end;}
.me .bubble{background:#005c4b;}
.name{font-size:12px;color:#53bdeb;}
.guestLabel{
  text-align:center;
  font-size:12px;
  opacity:.6;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
}
.modalContent{
  background:#1f2c34;
  padding:30px;
  border-radius:10px;
  max-width:400px;
  text-align:center;
}
.modalContent h3{color:#25d366;}
.modalContent a{
  display:inline-block;
  margin-top:15px;
  padding:12px 25px;
  background:red;
  color:white;
  text-decoration:none;
  border-radius:5px;
}
.closeBtn{
  margin-top:10px;
  cursor:pointer;
  color:#53bdeb;
}
</style>
</head>

<body>

<div class="header">
  <div class="menuBtn" onclick="toggleMenu()">⋮</div>
  🔥 Women Chat Room – Guest Access
</div>

<!-- SIDE MENU -->
<div class="sideMenu" id="sideMenu">
  <a href="#" onclick="showInfo('features')">Platform Features</a>
  <a href="#" onclick="showInfo('continue')">How To Continue?</a>
  <a href="https://your-affiliate-link.com">Create Account</a>
  <a href="#" onclick="toggleMenu()">⬅ Back</a>
</div>

<div class="messages" id="groupMessages"></div>

<div class="inputBox">
<input id="groupInput" placeholder="You are chatting as Guest...">
<button onclick="sendGroup()">Send</button>
</div>

<!-- SIGNUP MODAL -->
<div class="modal" id="signupModal">
  <div class="modalContent">
    <h3>Unlock Unlimited Messaging</h3>
    <p>You are currently using a Guest Account. Create a free account to continue unlimited chat access.</p>
    <a href="https://your-affiliate-link.com">Create Free Account</a>
    <div class="closeBtn" onclick="closeModal()">Continue as Guest</div>
  </div>
</div>

<script>

function toggleMenu(){
  let menu=document.getElementById("sideMenu");
  menu.style.left = menu.style.left==="0px" ? "-260px" : "0px";
}

function showInfo(type){
  alert(type==="features"
    ? "• Real-time group chat\n• Mobile friendly\n• Guest mode available\n• Optional account upgrade"
    : "You are using Guest mode. To unlock unlimited messaging and private features, create a free account from the menu."
  );
}

/* CHAT SYSTEM */
const names=["Anna","Sofia","Maya","Lina","Nora","Emily","Olivia","Ava","Mila","Sara"];
const texts=[
"Hello everyone!",
"Nice to meet you!",
"How is your day?",
"Happy to join!",
"This community is nice.",
"Anyone here today?",
"Let's chat!",
"I enjoy positive talks."
];

let box=document.getElementById("groupMessages");
let messageCount=0;

/* PRELOAD 50 MESSAGES */
for(let i=0;i<50;i++){
  let name=names[Math.floor(Math.random()*names.length)];
  let text=texts[Math.floor(Math.random()*texts.length)];
  box.insertAdjacentHTML("beforeend",`
    <div class="msg">
      <img src="https://randomuser.me/api/portraits/women/${Math.floor(Math.random()*80)}.jpg">
      <div class="bubble">
        <div class="name">${name}</div>
        ${text}
      </div>
    </div>
  `);
}
box.scrollTop=box.scrollHeight;

/* AUTO MESSAGE START */
setInterval(()=>{
  let name=names[Math.floor(Math.random()*names.length)];
  let text=texts[Math.floor(Math.random()*texts.length)];
  box.insertAdjacentHTML("beforeend",`
    <div class="msg">
      <img src="https://randomuser.me/api/portraits/women/${Math.floor(Math.random()*80)}.jpg">
      <div class="bubble">
        <div class="name">${name}</div>
        ${text}
      </div>
    </div>
  `);
  box.scrollTop=box.scrollHeight;
},6000);

function sendGroup(){
  let input=document.getElementById("groupInput");
  if(!input.value.trim()) return;

  messageCount++;

  box.insertAdjacentHTML("beforeend",`
    <div class="msg me">
      <div class="bubble">
        <div class="name">You (Guest)</div>
        ${input.value}
      </div>
    </div>
  `);

  input.value="";
  box.scrollTop=box.scrollHeight;

  if(messageCount>=3){
    document.getElementById("signupModal").style.display="flex";
  }
}

function closeModal(){
  document.getElementById("signupModal").style.display="none";
}

</script>

</body>
</html>
